[package]
name = "gp64"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gp64-capture = { path = "../gp64-capture" }
gp64-machine = { path = "../gp64-machine" }
gp64-opl2 = { path = "../gp64-opl2" }
gp64-hw.workspace = true
anyhow.workspace = true
gp64-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Preserve native backends and Wayland titles without the unmaintained font parser.
winit = { version = "=0.30.13", default-features = false, features = [
    "rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-crossfont",
] }
softbuffer = { version = "=0.4.8", default-features = false, features = [
    "x11", "x11-dlopen", "wayland", "wayland-dlopen",
] }
cpal = "=0.17.3"

[dev-dependencies]
rvp9-decoder = "0.2.0-alpha.4"
ropus = "0.11"

[lints]
workspace = true
