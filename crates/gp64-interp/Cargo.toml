[package]
name = "gp64-interp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fast opcode-switch interpreter for gp64"

[features]
arm_call_trace = []

emu_probes = ["gp64-cpu/emu_probes"]

interp-attrib = []

[dependencies]
gp64-types.workspace = true
gp64-cpu.workspace = true
gp64-memory-core.workspace = true
gp64-disasm = { workspace = true }
tracing.workspace = true

[dev-dependencies]
iced-x86.workspace = true
criterion = { workspace = true }
gp64-memory.workspace = true
gp64-memory-core = { workspace = true, features = ["test-util"] }

[[bench]]
name = "fast_interp"
harness = false

[lints]
workspace = true
